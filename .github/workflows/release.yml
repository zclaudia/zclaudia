# Single entry point for both release channels:
#   stable  — manual dispatch, publishes to a draft `v<version>` release
#   nightly — nightly schedule (or manual), publishes to a `nightly-<date>` prerelease
# Platform builds live in the reusable _release-build.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel.
        required: false
        type: choice
        options: [stable, nightly]
        default: stable
      version:
        description: 'Stable only: exact version (e.g. 0.1.42). Empty = reuse an open draft, else auto-bump.'
        required: false
        type: string
      platforms:
        description: Platforms to build.
        required: false
        type: choice
        options: [all, macos, linux, windows, android]
        default: all
  schedule:
    # 03:00 Asia/Shanghai daily
    - cron: '0 19 * * *'

permissions:
  contents: write

concurrency:
  # `inputs` is null on schedule, so a scheduled run is always the nightly channel.
  group: release-${{ inputs.channel || 'nightly' }}
  cancel-in-progress: ${{ (inputs.channel || 'nightly') == 'nightly' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      version_code: ${{ steps.meta.outputs.version_code }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CHANNEL="${INPUT_CHANNEL:-nightly}"

          if [ "$CHANNEL" = "nightly" ]; then
            MAJOR=$(jq -r .major version.json)
            MINOR=$(jq -r .minor version.json)
            NIGHTLY_DATE=$(TZ=Asia/Shanghai date +%F)
            YEAR=$(TZ=Asia/Shanghai date +%Y)
            DAY_OF_YEAR=$(TZ=Asia/Shanghai date +%j)
            # Windows MSI/WiX caps every semver component at 65535, so encode
            # nightly builds as (years since 2020) * 1000 + day-of-year.
            BUILD=$(( (10#$YEAR - 2020) * 1000 + 10#$DAY_OF_YEAR ))
            VERSION="${MAJOR}.${MINOR}.${BUILD}-nightly"
            VERSION_CODE=$((MAJOR * 10000000 + MINOR * 1000000 + BUILD))
            TAG="nightly-${NIGHTLY_DATE}"
            TITLE="ZClaudia Nightly ${NIGHTLY_DATE}"
            NOTES="Automated nightly build for ${NIGHTLY_DATE} (${VERSION})."
          else
            if [ -n "${INPUT_VERSION:-}" ]; then
              VERSION="$INPUT_VERSION"
            else
              EXISTING_DRAFT=$(gh release list --json tagName,isDraft \
                --jq '[.[] | select(.isDraft) | .tagName] | sort | reverse | first // empty' 2>/dev/null || true)
              if [ -n "$EXISTING_DRAFT" ]; then
                VERSION="${EXISTING_DRAFT#v}"
                echo "Reusing existing draft release: $EXISTING_DRAFT"
              else
                eval "$(./scripts/release/version-bump.sh --platform macos --bump)"
              fi
            fi
            MAJOR="$(echo "$VERSION" | cut -d. -f1)"
            MINOR="$(echo "$VERSION" | cut -d. -f2)"
            BUILD="$(echo "$VERSION" | cut -d. -f3)"
            # Same formula as scripts/release/version-bump.sh: 2 digits of minor, 4 of build.
            VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + BUILD))
            TAG="v${VERSION}"
            TITLE="ZClaudia ${VERSION}"
            NOTES="ZClaudia ${VERSION}"
          fi

          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "notes=$NOTES"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared $CHANNEL release: $TAG ($VERSION)"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing release: $TAG"
            exit 0
          fi
          if [ "$CHANNEL" = "nightly" ]; then
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --draft
          fi

      - name: Prune old nightly prereleases
        if: steps.meta.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OLD_NIGHTLIES=$(gh release list --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("nightly-")))] | sort_by(.tagName) | reverse | .[14:] | .[].tagName')
          [ -n "$OLD_NIGHTLIES" ] || exit 0
          echo "$OLD_NIGHTLIES" | while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --cleanup-tag --yes
          done

  build:
    needs: prepare
    uses: ./.github/workflows/_release-build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      build: ${{ needs.prepare.outputs.build }}
      version_code: ${{ needs.prepare.outputs.version_code }}
      tag: ${{ needs.prepare.outputs.tag }}
      platforms: ${{ inputs.platforms || 'all' }}
