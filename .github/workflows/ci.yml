name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'true'
      - run: pnpm format:check
      # Also runs the desktop React lifecycle invariant check.
      - run: pnpm lint

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'true'
      # `pnpm -r` builds plugins/agents/* in topological order before
      # shared/server/desktop, so no separate plugins:build step is needed.
      - run: pnpm -r run build
      - run: pnpm -r run test
