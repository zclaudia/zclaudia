name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repo carries a large lint/format backlog (see docs), so eslint and
  # prettier are scoped to the files this push or PR actually touches. That
  # keeps CI green today while blocking any *new* violation. Widen to the whole
  # repo (`pnpm lint` / `pnpm format:check`) once the backlog is burned down.
  lint:
    name: Lint & format (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install: 'true'

      - name: Collect changed files
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          # A first push to a branch reports an all-zero `before`; a shallow or
          # rewritten history may report a commit we do not have.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "No usable base commit — skipping scoped checks."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit, so a two-dot diff against the base is
          # exactly the set of files this change touches.
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD > changed.txt
          count=$(tr -cd '\0' < changed.txt | wc -c)
          echo "Base $base — $count changed file(s):"
          tr '\0' '\n' < changed.txt
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Prettier
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          grep -zE '\.(ts|tsx|js|mjs|cjs|json|md|ya?ml)$' changed.txt > format-files.txt || true
          if [ ! -s format-files.txt ]; then
            echo "No formattable files changed."
            exit 0
          fi
          xargs -0 -r pnpm exec prettier --check --ignore-unknown < format-files.txt

      - name: ESLint
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          grep -zE '\.(ts|tsx|js|mjs|cjs)$' changed.txt > lint-files.txt || true
          if [ ! -s lint-files.txt ]; then
            echo "No lintable files changed."
            exit 0
          fi
          xargs -0 -r pnpm exec eslint --no-warn-ignored < lint-files.txt

      # Whole-repo invariant check; already green, so it stays unscoped.
      - name: React lifecycle invariants
        run: pnpm --filter @zclaudia/desktop run check:lifecycle

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'true'
      # `pnpm -r` builds plugins/agents/* in topological order before
      # shared/server/desktop, so no separate plugins:build step is needed.
      - run: pnpm -r run build
      - run: pnpm -r run test
