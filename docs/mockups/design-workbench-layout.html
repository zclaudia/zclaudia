<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design workbench — layout mockup</title>
<style>
/* Real tokens, copied from apps/desktop/src/styles/index.css (light + dark neutral) */
:root, [data-theme="light"] {
  --background: 45 25% 97%; --foreground: 45 8% 10%; --card: 45 30% 99%; --sidebar: 45 15% 93%;
  --secondary: 45 12% 90%; --muted: 45 12% 91%; --muted-foreground: 45 5% 40%; --accent: 45 12% 87%;
  --border: 45 10% 86%; --primary: 214 70% 45%; --primary-foreground: 0 0% 100%;
  --success: 150 48% 33%; --warning: 38 80% 44%; --destructive: 4 66% 45%;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / .04);
  --shadow-md: 0 2px 8px -1px rgb(0 0 0 / .06), 0 1px 2px -1px rgb(0 0 0 / .04);
  --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .18), 0 2px 6px rgb(0 0 0 / .06);
  --page: 45 10% 88%;
}
[data-theme="dark"] {
  --background: 35 6% 8.5%; --foreground: 35 10% 91%; --card: 35 6% 11.5%; --sidebar: 35 6% 6.5%;
  --secondary: 35 5% 14%; --muted: 35 5% 14%; --muted-foreground: 35 6% 60%; --accent: 35 6% 17%;
  --border: 35 6% 17.5%; --primary: 214 70% 60%; --primary-foreground: 220 20% 10%;
  --success: 150 40% 52%; --warning: 40 70% 55%; --destructive: 4 62% 55%;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / .2);
  --shadow-md: 0 2px 8px -1px rgb(0 0 0 / .3), 0 1px 2px -1px rgb(0 0 0 / .2);
  --shadow-lg: 0 12px 32px -8px rgb(0 0 0 / .6), 0 2px 6px rgb(0 0 0 / .3);
  --page: 35 6% 4%;
}
* { box-sizing: border-box; margin: 0; }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; background: hsl(var(--page)); color: hsl(var(--foreground)); padding: 20px 24px 48px; }
.wrap { max-width: 1500px; margin: 0 auto; }
h1.t { font-size: 16px; font-weight: 600; }
.sub { color: hsl(var(--muted-foreground)); font-size: 13px; margin: 2px 0 14px; }
button { font: inherit; color: inherit; }
svg.ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.ic.sm { width: 13px; height: 13px; }
.mut { color: hsl(var(--muted-foreground)); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

/* ---------- mockup control bar (not part of the product UI) ---------- */
.bar { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin-bottom: 14px; }
.grp { display: flex; align-items: center; gap: 6px; }
.grp > span { font-size: 11px; font-weight: 500; color: hsl(var(--muted-foreground)); }
.seg { display: inline-flex; background: hsl(var(--secondary)); border-radius: 9px; padding: 2px; }
.seg button { font-size: 12px; border: 0; background: transparent; color: hsl(var(--muted-foreground)); height: 24px; padding: 0 10px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.seg button[aria-pressed="true"] { background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: var(--shadow-sm); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.hint { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 10px; }

/* ---------- stage: scaled window ---------- */
.stage { position: relative; width: 100%; display: flex; justify-content: center; }
.win {
  transform-origin: top left;
  position: absolute; left: 0; top: 0;
  display: flex; flex-direction: column; overflow: hidden;
  background: hsl(var(--background)); color: hsl(var(--foreground));
  border: 1px solid hsl(var(--border)); border-radius: 14px; box-shadow: var(--shadow-md);
  font-size: 12px; line-height: 1.4; user-select: none;
}
.win[data-layout="wide"] { width: 1440px; height: 880px; }
.win[data-layout="narrow"] { width: 460px; height: 880px; }
.win[data-layout="current"] { width: 1440px; height: 880px; }

/* ---------- primitives ---------- */
.btn { height: 28px; min-width: 28px; padding: 0 8px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: hsl(var(--muted-foreground)); display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: background .12s, color .12s; }
.btn:hover { background: hsl(var(--secondary)); color: hsl(var(--foreground)); }
.btn[aria-pressed="true"] { background: hsl(var(--secondary)); color: hsl(var(--foreground)); }
.btn:disabled { opacity: .4; cursor: not-allowed; background: transparent; }
.btn.fg { color: hsl(var(--foreground)); }
.btn.primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-weight: 500; }
.btn.primary:hover { background: hsl(var(--primary) / .9); color: hsl(var(--primary-foreground)); }
.btn.outline { border-color: hsl(var(--border)); color: hsl(var(--foreground)); }
.btn.xs { height: 24px; font-size: 11px; padding: 0 7px; }
.sep { width: 1px; height: 16px; background: hsl(var(--border)); margin: 0 4px; flex: none; }
.input { height: 28px; border-radius: 8px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); padding: 0 8px; font-size: 12px; color: hsl(var(--foreground)); width: 100%; display: flex; align-items: center; gap: 6px; min-width: 0; }
.input .u { color: hsl(var(--muted-foreground)); font-size: 11px; margin-left: auto; }
.sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid hsl(var(--border)); flex: none; }
.seg2 { display: inline-flex; border: 1px solid hsl(var(--border)); border-radius: 8px; padding: 1px; gap: 1px; width: 100%; }
.seg2 span { flex: 1; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: hsl(var(--muted-foreground)); font-size: 11px; cursor: pointer; }
.seg2 span.on { background: hsl(var(--secondary)); color: hsl(var(--foreground)); }
.label { font-size: 11px; font-weight: 500; color: hsl(var(--muted-foreground)); }
.kbd { font: 10px ui-monospace, Menlo, monospace; border: 1px solid hsl(var(--border)); border-radius: 4px; padding: 0 4px; color: hsl(var(--muted-foreground)); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--warning)); flex: none; }
.dot.ok { background: hsl(var(--success)); }

/* ---------- top bar ---------- */
.top { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid hsl(var(--border)); background: hsl(var(--background)); }
.tabs { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tab { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 9px; border-radius: 8px; color: hsl(var(--muted-foreground)); cursor: pointer; font-size: 12px; white-space: nowrap; }
.tab:hover { background: hsl(var(--secondary)); }
.tab.on { background: hsl(var(--secondary)); color: hsl(var(--foreground)); font-weight: 500; }
.tab .x { opacity: 0; width: 16px; height: 16px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; }
.tab:hover .x, .tab.on .x { opacity: .7; }
.tab .x:hover { background: hsl(var(--accent)); opacity: 1; }
.spacer { flex: 1; min-width: 8px; }
.zoom { display: flex; align-items: center; gap: 0; }
.zoom .pct { min-width: 54px; text-align: center; font-size: 11px; color: hsl(var(--muted-foreground)); }
.wid { width: 62px; height: 24px; border-radius: 7px; border: 1px solid hsl(var(--border)); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; color: hsl(var(--foreground)); background: hsl(var(--card)); }

/* ---------- main area ---------- */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) 300px; position: relative; }
.rail { display: flex; border-right: 1px solid hsl(var(--border)); background: hsl(var(--sidebar)); }
.rail-icons { width: 40px; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; border-right: 1px solid hsl(var(--border) / .7); }
.rail-icons .btn { width: 30px; height: 30px; padding: 0; }
.rail-panel { width: 224px; display: flex; flex-direction: column; min-height: 0; }
.panel-h { height: 36px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 12px; font-size: 11px; font-weight: 500; color: hsl(var(--muted-foreground)); }
.panel-b { flex: 1; min-height: 0; overflow: auto; padding: 0 6px 8px; }
.row { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 8px; color: hsl(var(--muted-foreground)); cursor: pointer; font-size: 12px; white-space: nowrap; }
.row:hover { background: hsl(var(--secondary)); color: hsl(var(--foreground)); }
.row.on { background: hsl(var(--secondary)); color: hsl(var(--foreground)); font-weight: 500; }
.row .tag { font-weight: 500; color: hsl(var(--foreground)); }
.row .cls { opacity: .75; }
.page-card { display: flex; gap: 8px; padding: 6px; border-radius: 10px; cursor: pointer; align-items: center; }
.page-card:hover { background: hsl(var(--secondary)); }
.page-card.on { background: hsl(var(--secondary)); }
.thumb { width: 54px; height: 38px; border-radius: 6px; border: 1px solid hsl(var(--border)); background: linear-gradient(180deg, hsl(var(--card)) 0 22%, hsl(var(--muted)) 22% 58%, hsl(var(--card)) 58%); flex: none; position: relative; overflow: hidden; }
.thumb::after { content: ""; position: absolute; left: 6px; top: 12px; width: 26px; height: 4px; border-radius: 2px; background: hsl(var(--foreground) / .5); }
.libgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 4px 0; }
.asset { aspect-ratio: 1.2; border-radius: 8px; border: 1px solid hsl(var(--border)); position: relative; overflow: hidden; cursor: pointer; }
.asset small { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 6px 3px; font-size: 10px; color: #fff; background: linear-gradient(transparent, rgb(0 0 0 / .55)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asset:hover { outline: 2px solid hsl(var(--primary) / .6); }

/* ---------- canvas ---------- */
.canvas-wrap { position: relative; background: hsl(var(--sidebar)); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.canvas { flex: 1; min-height: 0; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: flex-start; padding: 24px 24px 0; }
.page-holder { position: relative; flex: none; box-shadow: var(--shadow-md); border-radius: 4px; overflow: visible; }
.page { transform-origin: top left; background: #fff; color: #1d1b16; font-family: "Inter", -apple-system, system-ui, sans-serif; position: relative; overflow: hidden; border-radius: 4px; }
.win[data-mode="edit"] .page [data-sel]:hover:not(.selected) { outline: calc(1.5px / var(--s, 1)) solid hsl(var(--primary) / .55); outline-offset: calc(-1px / var(--s, 1)); cursor: pointer; }
.page [data-sel].selected { outline: calc(2px / var(--s, 1)) solid hsl(var(--primary)); outline-offset: calc(-1px / var(--s, 1)); position: relative; }
.sel-label { position: absolute; left: calc(-2px / var(--s, 1)); top: calc(-22px / var(--s, 1)); background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font: 500 calc(11px / var(--s, 1))/1 ui-monospace, Menlo, monospace; padding: calc(4px / var(--s, 1)) calc(7px / var(--s, 1)); border-radius: calc(4px / var(--s, 1)); white-space: nowrap; pointer-events: none; z-index: 5; }
.win[data-mode="run"] .page [data-sel] { cursor: default; }

/* mock page content */
.nav { display: flex; align-items: center; padding: 28px 64px; gap: 40px; }
.nav .logo { font-weight: 700; font-size: 22px; letter-spacing: -.02em; }
.nav .links { display: flex; gap: 28px; font-size: 16px; color: #6b665b; margin-left: 12px; }
.nav .sp { flex: 1; }
.nav .cta { background: #1d1b16; color: #fff; padding: 11px 20px; border-radius: 999px; font-size: 15px; font-weight: 500; }
.hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px; padding: 40px 64px 56px; align-items: center; }
.hero h1 { font-size: 64px; line-height: 1.05; letter-spacing: -.035em; font-weight: 700; margin: 0 0 20px; }
.hero h1 em { font-style: normal; color: #2f6fe4; }
.hero p { font-size: 19px; line-height: 1.55; color: #5e594e; margin: 0 0 30px; max-width: 480px; }
.hero .ctas { display: flex; gap: 12px; }
.hero .b1 { background: #2f6fe4; color: #fff; padding: 14px 26px; border-radius: 12px; font-weight: 600; font-size: 16px; }
.hero .b2 { padding: 14px 22px; border-radius: 12px; font-weight: 500; font-size: 16px; border: 1px solid #d9d5c9; }
.hero .art { aspect-ratio: 1.15; border-radius: 24px; background: radial-gradient(circle at 25% 20%, #ffd7a8 0 18%, transparent 19%), linear-gradient(135deg, #cfe0ff, #f4e3ff 60%, #ffe9d6); position: relative; overflow: hidden; }
.hero .art::before { content: ""; position: absolute; left: 12%; right: 12%; bottom: 12%; height: 46%; background: #fff; border-radius: 16px; box-shadow: 0 16px 40px rgb(30 30 60 / .18); }
.hero .art::after { content: ""; position: absolute; left: 18%; bottom: 22%; width: 38%; height: 8px; border-radius: 4px; background: #d9d5c9; box-shadow: 0 -22px 0 #d9d5c9, 0 -44px 0 #2f6fe4; }
.feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 24px 64px 64px; }
.feat div { background: #f6f3ea; border-radius: 18px; padding: 28px; font-size: 15px; color: #5e594e; }
.feat b { display: block; font-size: 19px; color: #1d1b16; margin-bottom: 8px; }
.page.m .nav { padding: 18px 20px; gap: 12px; } .page.m .nav .links { display: none; } .page.m .nav .logo { font-size: 18px; } .page.m .nav .cta { padding: 8px 14px; font-size: 13px; }
.page.m .hero { grid-template-columns: 1fr; gap: 24px; padding: 12px 20px 28px; }
.page.m .hero h1 { font-size: 36px; } .page.m .hero p { font-size: 15px; margin-bottom: 20px; }
.page.m .hero .b1, .page.m .hero .b2 { padding: 11px 18px; font-size: 14px; }
.page.m .feat { grid-template-columns: 1fr; padding: 8px 20px 28px; gap: 12px; }

/* floating agent bar */
.agent { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 6px 6px 6px 8px; display: flex; align-items: center; gap: 6px; z-index: 20; }
.agent .chip { height: 24px; display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border-radius: 7px; background: hsl(var(--secondary)); color: hsl(var(--foreground)); font: 11px ui-monospace, Menlo, monospace; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.agent .ph { flex: 1; color: hsl(var(--muted-foreground)); font-size: 13px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .send { width: 28px; height: 28px; border-radius: 9px; padding: 0; }
.popover { position: absolute; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 40; padding: 6px; min-width: 220px; }
.popover .mi { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 8px; font-size: 12px; cursor: pointer; color: hsl(var(--foreground)); }
.popover .mi:hover { background: hsl(var(--secondary)); }
.popover .mi .kbd { margin-left: auto; }
.popover hr { border: 0; border-top: 1px solid hsl(var(--border)); margin: 4px 0; }
.ctx-pop { left: 50%; bottom: 66px; transform: translateX(-50%); width: min(540px, calc(100% - 32px)); padding: 12px; }
.ctx-pop h4 { font-size: 11px; font-weight: 500; color: hsl(var(--muted-foreground)); margin: 0 0 8px; }
.ctx-sec { display: flex; gap: 8px; padding: 5px 0; font-size: 12px; align-items: baseline; border-top: 1px solid hsl(var(--border) / .7); }
.ctx-sec:first-of-type { border-top: 0; }
.ctx-sec b { width: 70px; flex: none; font-weight: 500; }
.ctx-sec span { color: hsl(var(--muted-foreground)); }
.toast { position: absolute; right: 14px; top: 12px; z-index: 60; background: hsl(var(--foreground)); color: hsl(var(--background)); border-radius: 12px; padding: 9px 12px; font-size: 12px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-lg); animation: tin .18s ease-out; }
.toast u { text-decoration: none; opacity: .75; cursor: pointer; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }

/* ---------- inspector ---------- */
.insp { border-left: 1px solid hsl(var(--border)); background: hsl(var(--background)); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.insp-h { padding: 10px 12px 8px; border-bottom: 1px solid hsl(var(--border)); }
.crumb { display: flex; align-items: center; gap: 2px; font: 11px ui-monospace, Menlo, monospace; color: hsl(var(--muted-foreground)); flex-wrap: wrap; }
.crumb i { font-style: normal; opacity: .5; padding: 0 1px; }
.crumb b { font-weight: 500; color: hsl(var(--foreground)); }
.insp-title { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; font-weight: 600; }
.itabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid hsl(var(--border)); }
.itab { height: 28px; padding: 0 10px; font-size: 12px; color: hsl(var(--muted-foreground)); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 5px; }
.itab:hover { color: hsl(var(--foreground)); }
.itab.on { color: hsl(var(--foreground)); border-bottom-color: hsl(var(--foreground)); font-weight: 500; }
.insp-b { flex: 1; min-height: 0; overflow: auto; }
details.sec { border-bottom: 1px solid hsl(var(--border)); }
details.sec > summary { list-style: none; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 11px; font-weight: 500; color: hsl(var(--muted-foreground)); cursor: pointer; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary:hover { color: hsl(var(--foreground)); }
details.sec > summary .chev { transition: transform .12s; transform: rotate(-90deg); }
details.sec[open] > summary .chev { transform: rotate(0); }
details.sec > summary .act { margin-left: auto; opacity: 0; }
details.sec > summary:hover .act { opacity: 1; }
.sec-b { padding: 0 12px 12px; display: grid; gap: 8px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f { display: grid; gap: 4px; min-width: 0; }
.ta { min-height: 52px; border-radius: 8px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); padding: 6px 8px; font-size: 12px; line-height: 1.45; }
.empty { padding: 28px 18px; text-align: center; color: hsl(var(--muted-foreground)); }
.empty .big { width: 36px; height: 36px; border-radius: 12px; background: hsl(var(--secondary)); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.empty h5 { font-size: 13px; font-weight: 600; color: hsl(var(--foreground)); margin: 0 0 4px; }
.stat { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 12px; }
.rule { margin: 0 12px 10px; border: 1px solid hsl(var(--border)); border-radius: 10px; overflow: hidden; }
.rule .rh { display: flex; justify-content: space-between; padding: 6px 10px; background: hsl(var(--muted)); font-size: 11px; }
.rule .rb { padding: 6px 10px; font: 11.5px/1.7 ui-monospace, Menlo, monospace; }
.rule s { color: hsl(var(--muted-foreground)); }
.ver { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid hsl(var(--border) / .7); align-items: flex-start; }
.ver .vd { margin-top: 5px; }
.ver b { font-weight: 500; font-size: 12px; display: block; }
.ver span { font-size: 11px; color: hsl(var(--muted-foreground)); }
.ver .btn { margin-left: auto; }

/* ---------- status bar ---------- */
.status { height: 26px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-top: 1px solid hsl(var(--border)); font-size: 11px; color: hsl(var(--muted-foreground)); background: hsl(var(--background)); }
.status .sp { flex: 1; }
.status .item { display: inline-flex; align-items: center; gap: 5px; }
.status .warn { color: hsl(var(--warning)); }

/* ---------- modal ---------- */
.scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .32); z-index: 80; display: flex; align-items: center; justify-content: center; }
.modal { width: 520px; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 20px; box-shadow: var(--shadow-lg); overflow: hidden; }
.modal-h { display: flex; align-items: center; padding: 12px 14px 0 16px; font-size: 14px; font-weight: 600; }
.modal-h .btn { margin-left: auto; }
.modal-b { padding: 14px 16px 16px; display: grid; gap: 10px; font-size: 12px; }
.opt { display: flex; align-items: center; gap: 10px; border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 10px 12px; }
.opt b { font-weight: 500; display: block; font-size: 12px; } .opt span { color: hsl(var(--muted-foreground)); font-size: 11px; }
.opt .btn { margin-left: auto; }

/* ---------- drawer (narrow) ---------- */
.menu-btn-narrow { display: none; }
.win[data-layout="narrow"] .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 330px; }
.win[data-layout="narrow"] .rail { display: none; position: absolute; left: 0; top: 0; bottom: 0; z-index: 70; box-shadow: var(--shadow-lg); }
.win[data-layout="narrow"][data-drawer="open"] .rail { display: flex; }
.win[data-layout="narrow"] .rail .rail-icons { display: flex; }
.win[data-layout="narrow"] .insp { border-left: 0; border-top: 1px solid hsl(var(--border)); border-radius: 14px 14px 0 0; box-shadow: 0 -4px 14px rgb(0 0 0 / .06); }
.win[data-layout="narrow"] .menu-btn-narrow { display: inline-flex; }
.win[data-layout="narrow"] .only-wide { display: none !important; }
.win[data-layout="narrow"] .canvas { padding: 12px 0 0; }
.win[data-layout="narrow"] .agent { bottom: 10px; width: calc(100% - 20px); }
.win[data-layout="narrow"] .agent .chip { max-width: 90px; }
.win[data-layout="narrow"] .tab:not(.on) { display: none; }
.grab { display: none; width: 36px; height: 4px; border-radius: 2px; background: hsl(var(--border)); margin: 6px auto 0; }
.win[data-layout="narrow"] .grab { display: block; }
.win[data-layout="narrow"] .status .only-wide-s { display: none; }

/* ---------- run mode ---------- */
.win[data-mode="run"] .insp-b, .win[data-mode="run"] .itabs { display: none; }
.win[data-mode="run"] .agent { display: none; }
.runnote { display: none; padding: 24px 18px; text-align: center; color: hsl(var(--muted-foreground)); }
.win[data-mode="run"] .runnote { display: block; }
.win[data-mode="run"] .insp-h { display: none; }

/* ---------- "current" (reference) rendition ---------- */
.cur .cb { height: 24px; padding: 0 8px; border-radius: 8px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: hsl(var(--foreground)); white-space: nowrap; }
.cur .cb.p { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: transparent; }
.cur .cb.g { background: transparent; border-color: transparent; color: hsl(var(--muted-foreground)); }
.cur .cb.d { opacity: .45; }
.cur .r { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid hsl(var(--border)); }
.cur .banner { padding: 6px 12px; border-bottom: 1px solid hsl(var(--border)); font-size: 11px; color: hsl(var(--muted-foreground)); }
.cur .banner.w { color: hsl(var(--warning)); }
.cur .ctab { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; padding: 2px 6px; border-radius: 8px; border: 1px solid transparent; }
.cur .ctab.on { border-color: hsl(var(--primary) / .4); background: hsl(var(--primary) / .1); }
.cur .edit { height: 256px; flex: none; overflow: hidden; border-top: 1px solid hsl(var(--border)); padding: 12px; position: relative; }
.cur .edit::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, hsl(var(--background))); }
.cur .gridf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; margin-top: 10px; }
.cur .fl { font-size: 10px; color: hsl(var(--muted-foreground)); margin-bottom: 3px; }
.note { position: absolute; z-index: 90; background: hsl(var(--destructive)); color: #fff; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; box-shadow: var(--shadow-md); white-space: nowrap; }
.note::before { content: ""; position: absolute; left: 14px; top: -4px; width: 8px; height: 8px; background: inherit; transform: rotate(45deg); }
body:not([data-notes="on"]) .note { display: none; }
</style>

<script>
const $ = (s, r = document) => r.querySelector(s);
const ic = (n, c = '') => `<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;

const S = { layout: 'wide', theme: 'light', sel: 'h1', mode: 'edit', left: 'pages', lib: 'assets', right: 'design', menu: false, ctx: false, modal: null, toast: null, drawer: false };

const ELS = {
  none: null,
  nav:  { tag: 'header', cls: 'nav', crumbs: ['body', 'header.nav'], kind: 'box', title: 'Header' },
  h1:   { tag: 'h1', cls: 'hero-title', crumbs: ['body', 'main.hero', 'h1.hero-title'], kind: 'text', title: 'Heading 1', text: 'Plan your week in focus' },
  p:    { tag: 'p', cls: 'hero-sub', crumbs: ['body', 'main.hero', 'p.hero-sub'], kind: 'text', title: 'Paragraph', text: 'Lumen turns a messy to-do list into a calm, realistic plan.' },
  btn:  { tag: 'a', cls: 'btn-primary', crumbs: ['body', 'main.hero', 'div.ctas', 'a.btn-primary'], kind: 'link', title: 'Link', text: 'Start free' },
  img:  { tag: 'img', cls: 'hero-art', crumbs: ['body', 'main.hero', 'figure', 'img.hero-art'], kind: 'img', title: 'Image' },
};

/* ================= inspector ================= */
const field = (l, v, u = '') => `<div class="f"><span class="label">${l}</span><div class="input"><span>${v}</span>${u ? `<span class="u">${u}</span>` : ''}</div></div>`;
const colorField = (l, hex) => `<div class="f"><span class="label">${l}</span><div class="input"><i class="sw" style="background:${hex}"></i><span class="mono">${hex}</span><span class="u" title="clear">${ic('x', 'sm')}</span></div></div>`;
const sec = (title, body, open = true, act = '') => `<details class="sec" ${open ? 'open' : ''}><summary>${ic('chev', 'sm chev')}${title}${act ? `<span class="act">${act}</span>` : ''}</summary><div class="sec-b">${body}</div></details>`;

function designTab(el) {
  if (!el) {
    return `<div class="empty"><div class="big">${ic('pointer')}</div><h5>在画布上选择一个元素</h5><div style="font-size:12px">点击页面中的元素来编辑它;<br>或者直接让 Agent 帮你改。</div></div>
      <div style="border-top:1px solid hsl(var(--border));padding:8px 0">
        <div class="stat"><span class="mut">页面</span><span>index.html</span></div>
        <div class="stat"><span class="mut">大小</span><span>4.2 KB</span></div>
        <div class="stat"><span class="mut">依赖</span><span>1 样式表 · 3 素材</span></div>
        <div class="stat"><span class="mut">视口</span><span>${S.layout === 'narrow' ? 'Fill' : 'Desktop 1280'}</span></div>
      </div>
      <div style="padding:8px 12px;display:grid;gap:6px">
        <button class="btn outline fg" style="justify-content:flex-start">${ic('sparkles')} 让 Agent 生成新页面…</button>
        <button class="btn outline fg" style="justify-content:flex-start">${ic('library')} 从模板开始…</button>
      </div>`;
  }
  const out = [];
  if (el.kind === 'text' || el.kind === 'link')
    out.push(sec('Text', `<div class="ta">${el.text}</div>`));
  if (el.kind === 'link')
    out.push(sec('Link', `<div class="f"><span class="label">URL</span><div class="input">${ic('link', 'sm')}<span class="mono">/signup</span><span class="u">${ic('x', 'sm')}</span></div></div>
      <div class="f"><span class="label">Opens in</span><div class="seg2"><span class="on">Same tab</span><span>New tab</span></div></div>`));
  if (el.kind === 'img')
    out.push(sec('Image', `<div style="border:1px solid hsl(var(--border));border-radius:10px;height:84px;background:linear-gradient(135deg,#cfe0ff,#f4e3ff 60%,#ffe9d6);position:relative"><span style="position:absolute;left:8px;bottom:6px;font:10px ui-monospace,monospace;background:rgb(255,255,255,.85);color:#222;padding:1px 6px;border-radius:5px">assets/hero-art.png</span></div>
      <div style="display:flex;gap:6px"><button class="btn outline fg xs" style="flex:1">${ic('image', 'sm')} 从素材库选择</button><button class="btn outline fg xs" style="flex:1">${ic('sparkles', 'sm')} 生成</button></div>
      <div class="f"><span class="label">Alt text</span><div class="input"><span>Planner app preview</span></div></div>`));
  if (el.kind === 'text' || el.kind === 'link')
    out.push(sec('Typography', `<div class="g2">${field('Size', el.tag === 'h1' ? '64' : el.tag === 'p' ? '19' : '16', 'px')}${field('Weight', el.tag === 'p' ? '400' : '700')}</div>
      <div class="g2">${field('Line height', el.tag === 'h1' ? '1.05' : '1.55')}${field('Spacing', '-0.035', 'em')}</div>
      <div class="seg2"><span class="on">Left</span><span>Center</span><span>Right</span></div>`));
  out.push(sec('Fill & border', `<div class="g2">${colorField('Text color', el.kind === 'link' ? '#ffffff' : el.tag === 'p' ? '#5e594e' : '#1d1b16')}${colorField('Background', el.kind === 'link' ? '#2f6fe4' : 'none').replace('#none', 'none')}</div>
      <div class="g2">${field('Radius', el.kind === 'link' ? '12' : el.kind === 'img' ? '24' : '0', 'px')}${field('Border', '0', 'px')}</div>`, el.kind !== 'text'));
  out.push(sec('Size & spacing', `<div class="g2">${field('Width', 'auto')}${field('Height', 'auto')}</div>
      <div class="g2">${field('Padding', el.kind === 'link' ? '14 26' : '0')}${field('Margin', el.tag === 'h1' ? '0 0 20' : '0')}</div>`, false));
  out.push(`<div style="padding:8px 12px;display:flex;gap:4px;align-items:center"><button class="btn xs">${ic('file', 'sm')} View source</button><span class="spacer"></span><button class="btn xs" style="color:hsl(var(--destructive))">${ic('trash', 'sm')} Delete</button></div>`);
  return out.join('');
}

function stylesTab(el) {
  if (!el) return `<div class="empty"><h5>未选中元素</h5><div>选中元素后,这里显示生效的 CSS 规则与覆盖原因。</div></div>`;
  return `<div style="padding:10px 12px 6px;display:flex;align-items:center"><span class="label">生效规则 · 3</span><span class="spacer"></span><button class="btn xs" disabled>${ic('check', 'sm')} Save styles</button></div>
    <div class="rule"><div class="rh"><span class="mono">element.style</span><span class="mut">inline</span></div><div class="rb">color: #1d1b16;</div></div>
    <div class="rule"><div class="rh"><span class="mono">.hero ${el.tag}</span><span class="mut">styles.css:42</span></div><div class="rb">font-size: 64px;<br>letter-spacing: -.035em;<br><s>margin: 0 0 12px;</s> <span class="mut">← 被覆盖</span></div></div>
    <div class="rule"><div class="rh"><span class="mono">${el.tag}</span><span class="mut">@inline/style#1</span></div><div class="rb">font-weight: 700;</div></div>`;
}

function historyTab() {
  return `<div class="ver"><span class="dot vd"></span><div><b>未保存的修改</b><span>刚刚 · 2 处改动</span></div><button class="btn xs">${ic('diff', 'sm')} Diff</button></div>
    <div class="ver"><span class="dot ok vd"></span><div><b>Agent 完成一次运行</b><span>3 分钟前 · 自动保存点 · 1 页 2 素材</span></div><button class="btn xs">Restore</button></div>
    <div class="ver"><span class="dot ok vd"></span><div><b>保存</b><span>12 分钟前 · 手动</span></div><button class="btn xs">Restore</button></div>
    <div class="ver"><span class="dot ok vd"></span><div><b>从模板 “SaaS landing” 安装</b><span>今天 21:58</span></div><button class="btn xs">Restore</button></div>`;
}

function renderInspector() {
  const el = ELS[S.sel];
  const head = el
    ? `<div class="crumb">${el.crumbs.map((c, i) => i === el.crumbs.length - 1 ? `<b>${c}</b>` : `${c}<i>›</i>`).join('')}</div>
       <div class="insp-title">${el.title}<span class="spacer"></span><button class="btn xs" title="Parent">${ic('chev-up', 'sm')}</button></div>`
    : `<div class="insp-title" style="margin-top:0">Inspector</div>`;
  const body = S.right === 'design' ? designTab(el) : S.right === 'styles' ? stylesTab(el) : historyTab();
  return `<div class="grab"></div>
    <div class="insp-h">${head}</div>
    <div class="itabs">
      ${[['design', 'Design', 'pointer'], ['styles', 'Styles', 'tree'], ['history', 'History', 'history']].map(([k, l, i]) => `<span class="itab ${S.right === k ? 'on' : ''}" data-act="rtab" data-v="${k}">${l}${k === 'history' ? '<span class="dot" style="margin-left:2px"></span>' : ''}</span>`).join('')}
    </div>
    <div class="insp-b">${body}</div>
    <div class="runnote"><div class="empty"><div class="big">${ic('play')}</div><h5>运行模式</h5><div style="font-size:12px">只做交互,不能编辑。<br>切回 Edit 继续修改。</div></div></div>`;
}

/* ================= left rail ================= */
function leftPanel() {
  if (S.left === 'pages') {
    return `<div class="panel-h">Pages<button class="btn xs" style="margin-right:-4px">${ic('plus', 'sm')}</button></div>
      <div class="panel-b">
        ${[['index.html', true, true], ['pricing.html', false, false], ['about.html', false, false], ['deck.html', false, false]].map(([n, on, dirty]) => `<div class="page-card ${on ? 'on' : ''}"><div class="thumb"></div><div style="min-width:0"><div style="font-size:12px;font-weight:${on ? 500 : 400};display:flex;gap:5px;align-items:center">${n}${dirty ? '<span class="dot"></span>' : ''}</div><div class="mut" style="font-size:10px">${n === 'deck.html' ? '8 slides' : on ? '已打开' : '未打开'}</div></div></div>`).join('')}
      </div>`;
  }
  if (S.left === 'layers') {
    const r = (id, depth, tag, cls) => `<div class="row ${S.sel === id ? 'on' : ''}" style="padding-left:${8 + depth * 14}px" data-act="sel" data-v="${id}"><span class="mut" style="width:12px">${['nav', 'h1', 'p', 'btn', 'img'].includes(id) ? '' : ''}</span><span><span class="tag">${tag}</span><span class="cls">${cls}</span></span></div>`;
    return `<div class="panel-h">Layers<span class="kbd">⌘ ⇧ L</span></div>
      <div class="panel-b">
        ${r('x0', 0, 'body', '')}
        ${r('nav', 1, 'header', '.nav')}
        ${r('x1', 1, 'main', '.hero')}
        ${r('h1', 2, 'h1', '.hero-title')}
        ${r('p', 2, 'p', '.hero-sub')}
        ${r('x2', 2, 'div', '.ctas')}
        ${r('btn', 3, 'a', '.btn-primary')}
        ${r('x3', 3, 'a', '.btn-ghost')}
        ${r('x4', 2, 'figure', '')}
        ${r('img', 3, 'img', '.hero-art')}
        ${r('x5', 1, 'section', '.features')}
      </div>`;
  }
  const lib = { templates: ['SaaS landing', 'Portfolio', 'Pitch deck', 'Docs'], brand: null, assets: ['hero-art.png', 'logo.svg', 'team.jpg', 'inter.woff2'], media: null };
  const grad = ['linear-gradient(135deg,#cfe0ff,#f4e3ff)', 'linear-gradient(135deg,#1d1b16,#5e594e)', 'linear-gradient(135deg,#ffd7a8,#ffe9d6)', 'linear-gradient(135deg,#d6f0e2,#cfe0ff)'];
  let body = '';

/* ================= render ================= */
function fitStage() {
  const win = $('#win'), stage = $('#stage');
  const w = S.layout === 'narrow' ? 460 : 1440, h = 880;
  const avail = Math.min(document.documentElement.clientWidth - 48, 1500);
  const k = Math.min(1, avail / w);
  win.style.transform = `scale(${k})`;
  stage.style.height = `${h * k + 4}px`;
  stage.style.width = `${w * k}px`;
  stage.style.margin = '0 auto';
  win.style.left = '0';
}
function fitPage() {
  const holder = $('#holder'), page = $('#page'), canvas = $('#canvas');
  if (!holder || !page || !canvas) return;
  if (S.layout === 'narrow') {
    const cw = canvas.clientWidth; // fill preset: scale 1
    page.style.width = cw + 'px'; page.style.transform = 'none'; page.style.setProperty('--s', 1);
    holder.style.width = cw + 'px'; holder.style.height = page.offsetHeight + 'px';
    $('#zoom-pct') && ($('#zoom-pct').textContent = 'Fill');
    return;
  }
  const cs = getComputedStyle(canvas);
  const avail = canvas.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const k = Math.min(1, avail / 1280);
  page.style.width = '1280px';
  page.style.transform = `scale(${k})`; page.style.setProperty('--s', k);
  holder.style.width = 1280 * k + 'px'; holder.style.height = page.offsetHeight * k + 'px';
  const pct = Math.round(k * 100);
  if ($('#zoom-pct')) $('#zoom-pct').textContent = `Fit · ${pct}%`;
  if ($('#st-zoom')) $('#st-zoom').textContent = `${pct}%`;
}
function render() {
  const win = $('#win');
  document.body.dataset.theme = S.theme;
  document.documentElement.dataset.theme = S.theme;
  win.dataset.layout = S.layout; win.dataset.mode = S.mode; win.dataset.drawer = S.drawer ? 'open' : 'closed';
  const scrollTop = ($('.insp-b') || {}).scrollTop || 0;
  win.innerHTML = S.layout === 'current' ? buildCurrent() : buildWideNarrow();
  const ib = $('.insp-b'); if (ib) ib.scrollTop = scrollTop;
  fitStage(); fitPage();
  // sync mockup control bar
  for (const [id, key] of [['seg-layout', 'layout'], ['seg-theme', 'theme'], ['seg-sel', 'sel']])
    $('#' + id).querySelectorAll('button').forEach(bn => bn.setAttribute('aria-pressed', String(bn.dataset.v === S[key])));
  $('#notes-grp').style.display = S.layout === 'current' ? '' : 'none';
  $('#hint').innerHTML = S.layout === 'current'
    ? '现状(按代码还原):顶栏 20 个文字按钮 + 页签条 + 视口条 + 多条横幅,画布与 256px 的长表单编辑区上下争抢空间。'
    : S.layout === 'narrow'
      ? '窄面板(≈460px):顶栏只留核心图标;Pages/Layers/Library 变成左侧抽屉(点左上角图标);检查器变成画布下方的底部面板;Agent 输入条浮在画布底部。'
      : '宽布局:顶栏一行 · 左栏(Pages / Layers / Library,可收起)· 画布 · 右侧检查器(Design / Styles / History)· 底部状态条。试试点页面里的标题、图片、按钮,以及右上角 ⋯。';
}

document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]');
  const t = e.target.closest('[data-act],[data-sel],[data-v]');
  const closeOutside = () => { if (S.menu || S.ctx) { S.menu = false; S.ctx = false; } };
  // mockup control bar
  const sg = e.target.closest('.bar .seg button');
  if (sg) {
    const id = sg.parentElement.id, v = sg.dataset.v;
    if (id === 'seg-layout') { S.layout = v; S.drawer = false; S.menu = S.ctx = false; S.modal = null; }
    if (id === 'seg-theme') S.theme = v;
    if (id === 'seg-sel') { S.sel = v; S.mode = 'edit'; S.right = S.right === 'history' ? 'design' : S.right; }
    if (id === 'seg-notes') { document.body.dataset.notes = v; return syncNotes(); }
    return render();
  }
  if (!e.target.closest('#win')) return;
  const selEl = e.target.closest('[data-sel]');
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const a = actEl.dataset.act, v = actEl.dataset.v;
    if (a === 'closemodal') { if (actEl.classList.contains('scrim') && stop) return; S.modal = null; }
    else if (a === 'mode') { S.mode = v; if (v === 'run') { S.menu = S.ctx = false; } }
    else if (a === 'menu') { S.menu = !S.menu; S.ctx = false; }
    else if (a === 'ctx') { S.ctx = !S.ctx; S.menu = false; }
    else if (a === 'modal') { S.modal = v; S.menu = false; }
    else if (a === 'rtab') S.right = v;
    else if (a === 'ltab') { S.left = v === 'lib' ? 'lib' : v; }
    else if (a === 'lib') S.lib = v;
    else if (a === 'drawer') S.drawer = !S.drawer;
    else if (a === 'send') { S.toast = true; S.ctx = false; setTimeout(() => { S.toast = null; render(); }, 3500); }
    else if (a === 'toastclose') S.toast = null;
    else if (a === 'sel') { if (v in ELS) S.sel = v; }
    return render();
  }
  if (selEl && S.mode === 'edit' && S.layout !== 'current') {
    S.sel = selEl.dataset.sel; S.menu = S.ctx = false; if (S.right === 'history') S.right = 'design';
    return render();
  }
  if (e.target.closest('.canvas') && S.mode === 'edit' && S.layout !== 'current' && !e.target.closest('.agent')) { S.sel = 'none'; return render(); }
  if (S.menu || S.ctx) { closeOutside(); render(); }
});
function syncNotes() {
  document.querySelectorAll('#seg-notes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === document.body.dataset.notes)));
}
window.addEventListener('resize', () => { fitStage(); fitPage(); });
render();
</script>
